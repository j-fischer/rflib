<template>
    <div lwc:if={isSearching}>
        <lightning-spinner class="slds-is-fixed" size="large" alternative-text="Searching records...">
        </lightning-spinner>
    </div>
    <lightning-card title={title} icon-name="utility:list">
        <div class="slds-m-around_medium">
            <div class="filter-bar" onkeyup={handleSearchKeyUp}>
                <template for:each={columns} for:item="column">
                    <div key={column.fieldName} class="filter-cell">
                        <template lwc:if={column.isRange}>
                            <div class="range-filter">
                                <lightning-input
                                    type={column.rangeInputType}
                                    label={column.label}
                                    variant="label-hidden"
                                    placeholder="From"
                                    title={column.label}
                                    data-field={column.fieldName}
                                    data-part="fromValue"
                                    onchange={handleColumnFilterChange}
                                >
                                </lightning-input>
                                <lightning-input
                                    type={column.rangeInputType}
                                    label={column.label}
                                    variant="label-hidden"
                                    placeholder="To"
                                    title={column.label}
                                    data-field={column.fieldName}
                                    data-part="toValue"
                                    onchange={handleColumnFilterChange}
                                >
                                </lightning-input>
                            </div>
                        </template>
                        <template lwc:else>
                            <lightning-input
                                type="search"
                                label={column.label}
                                variant="label-hidden"
                                placeholder={column.placeholder}
                                data-field={column.fieldName}
                                data-part="value"
                                onchange={handleColumnFilterChange}
                            >
                            </lightning-input>
                        </template>
                    </div>
                </template>
            </div>
            <div class="filter-bar slds-m-top_x-small" onkeyup={handleSearchKeyUp}>
                <div class="filter-cell global-search">
                    <lightning-input
                        type="search"
                        label="Search all fields"
                        variant="label-hidden"
                        placeholder="Search all fields..."
                        data-id="global-search"
                        onchange={handleGlobalSearchChange}
                    >
                    </lightning-input>
                </div>
                <div>
                    <lightning-button label="Search" onclick={executeSearch}></lightning-button>
                </div>
            </div>
            <table
                class="slds-table slds-table_bordered slds-table_striped slds-table_cell-buffer slds-table_fixed-layout slds-m-top_small"
            >
                <thead>
                    <tr class="slds-text-heading_label">
                        <template for:each={columns} for:item="column">
                            <th key={column.fieldName} scope="col">
                                <div class="slds-truncate" title={column.label}>{column.label}</div>
                            </th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <c-rflib-big-object-record-list-row
                            key={row.key}
                            row={row}
                            data-key={row.key}
                            onclick={handleRowClick}
                        ></c-rflib-big-object-record-list-row>
                    </template>
                </tbody>
            </table>
        </div>
    </lightning-card>
</template>
