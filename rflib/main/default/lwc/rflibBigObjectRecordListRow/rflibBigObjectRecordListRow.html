<template>
    <tr class={rowClass} aria-selected={row.isSelected}>
        <template for:each={row.cells} for:item="cell">
            <td key={cell.key} class="slds-truncate" data-field={cell.key}>
                <template lwc:if={cell.isDatetime}>
                    <lightning-formatted-date-time
                        value={cell.value}
                        year="numeric"
                        day="2-digit"
                        month="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                        second="2-digit"
                    >
                    </lightning-formatted-date-time>
                </template>
                <template lwc:elseif={cell.isDate}>
                    <!-- A date carries no time, so it must not be shifted into the user's time zone. -->
                    <lightning-formatted-date-time
                        value={cell.value}
                        year="numeric"
                        day="2-digit"
                        month="2-digit"
                        time-zone="UTC"
                    >
                    </lightning-formatted-date-time>
                </template>
                <template lwc:elseif={cell.isNumber}>
                    <lightning-formatted-number value={cell.value}></lightning-formatted-number>
                </template>
                <template lwc:else>
                    <div class="slds-truncate" title={cell.value}>{cell.value}</div>
                </template>
            </td>
        </template>
    </tr>
</template>
